<!--  Start Holiday Master dialog  -->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">{{(holidayMasterDetail?.id)?'Update':'Add'}} Holiday</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose(false)">close</mat-icon>
    </a>
  </div>

  <form [formGroup]="addHolidayMasterForm" (submit)="onSubmit(addHolidayMasterForm)">
    <div class="modal__body">
      <div class="row">

        <div class="col-md-12 MT-10">

          <mat-form-field>
            <mat-select placeholder="Year" formControlName="year" (selectionChange)="updateDateSelection($event.value)"
                        required>
              <mat-option *ngFor="let yr of yearList" [value]="yr['key']">
                {{'January - '+yr['key']+' To December - '+yr['key']}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addHolidayMasterForm.get('year'))"
                            [errMsg]="validationMsg.YEAR_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12">
          <mat-form-field>
            <input matInput [matDatepicker]="holidayDate" placeholder="Holiday Date"
                   formControlName="date" required/>
            <mat-datepicker-toggle matSuffix [for]="holidayDate"></mat-datepicker-toggle>
            <mat-datepicker #holidayDate></mat-datepicker>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addHolidayMasterForm.get('date'))"
                            [errMsg]="validationMsg.DATE_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <textarea matInput formControlName="description" rows="3" placeholder="Description"></textarea>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addHolidayMasterForm.get('description'))"
                            [errMsg]="validationMsg.NOTE_REQUIRED"></app-validation>
          </div>
        </div>
        <div class="col-md-12 MT-10">
          <mat-form-field>
            <mat-select placeholder="Holiday display to client dashboard?" formControlName="is_client">
              <mat-option *ngFor="let yesNo of yesNoDropDown.slice(1)" [value]="yesNo?.key">
                {{ yesNo?.label}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addHolidayMasterForm.get('is_client'))"
                            [errMsg]="validationMsg.CLIENT_DASHBOARD_SHOW_REQUIRED"></app-validation>
          </div>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <div class="text-right row">
        <div class="col-md-12 PR-25">
          <button class="btn-primary" [disabled]="addHolidayMasterForm.invalid">Save</button>
        </div>
      </div>
    </div>
  </form>
</div>
<!--  End Holiday Master dialog  -->

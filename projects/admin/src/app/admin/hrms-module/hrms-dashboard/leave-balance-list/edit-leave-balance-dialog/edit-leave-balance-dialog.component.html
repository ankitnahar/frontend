<!--  Start Edit Leave details dialog  -->
<div class="modal">
  <div class="modal__header">
    <div class="modal__header__logo">Update Leave Balance : {{leaveBalance?.userfullname}}</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose(false)">close</mat-icon>
    </a>
  </div>

  <form [formGroup]="EditLeaveListForm" (submit)="onSubmitForm(EditLeaveListForm)">
    <div class="modal__body">
      <div class="row">
        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput placeholder="User Name"
                   formControlName="userfullname" readonly/>
          </mat-form-field>
        </div>
        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput placeholder="Bio ID"
                   formControlName="user_bio_id" type="number" readonly/>
          </mat-form-field>
        </div>
        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput placeholder="CL"
                   formControlName="cl" type="number"/>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(EditLeaveListForm.get('cl'))"
                            [errMsg]="validationMsg.LEAVE_CL_REQUIRED"></app-validation>
          </div>
        </div>
        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput placeholder="CO"
                   formControlName="co" type="number"/>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(EditLeaveListForm.get('co'))"
                            [errMsg]="validationMsg.LEAVE_CO_REQUIRED"></app-validation>
          </div>
        </div>
        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput placeholder="LA"
                   formControlName="la" type="number"/>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(EditLeaveListForm.get('la'))"
                            [errMsg]="validationMsg.LEAVE_LA_REQUIRED"></app-validation>
          </div>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <div class="text-right row">
        <div class="col-md-12 PR-25">
          <button class="btn-primary" [disabled]="EditLeaveListForm.invalid">Save</button>
        </div>
      </div>
    </div>
  </form>
</div>
<!--  End Change InOut Time dialog  -->

<div class="holiday-list-out-container">
  <!-- Start BreadCrumb Top Header -->
  <div class="breadcrumb-top-header">
    <div class="row">
      <div class="col-md-12 PL-0">
        <div class="breadcrumb-top-header__breadcrumbs">
          <mat-icon class="material-icons cursor-pointer"><a (click)="onGoDashboard()">home</a></mat-icon>
          <mat-icon>keyboard_arrow_right</mat-icon>
          <span>HRMS</span>
          <mat-icon>keyboard_arrow_right</mat-icon>
          <span class="active">AWARDEE OF THE MONTH</span>
        </div>
      </div>
    </div>
  </div>
  <!-- Start Table -->
  <div class="table-container">
    <div class="table-block">
      <table>
        <thead>
        <tr>
          <th width="8%">Sr. No</th>
          <th width="45%">Name</th>
          <th width="22%">Month</th>
          <th width="25%">Award Type</th>
        </tr>
        </thead>
      </table>

      <div class="table-body">
        <table>
          <tbody *ngIf="nomineeList.length > 0">
          <tr *ngFor="let nominee of nomineeList; let i = index">
            <td width="8%">{{i + 1}}</td>
            <td width="45%">{{nominee?.userfullname}}</td>
            <td width="22%">{{nominee?.award_month}}</td>
            <td width="25%">{{nominee?.name}}</td>
          </tr>
          </tbody>
          <tbody *ngIf="nomineeList.length ===0" class="panel-title">No Records Found</tbody>
        </table>
      </div>

      <!--<table *ngIf="nomineeList.length > 0">-->

            <!--</mat-paginator>-->
          <!--</td>-->
        <!--</tr>-->
        <!--</tfoot>-->
      <!--</table>-->
    </div>
  </div>
</div>  <!-- End Table -->

<!--  Start Add Master Activity dialog  -->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">{{(data && data.activityData) ? 'Update' : 'Add'}} Master Activity</div>
  </div>

  <div class="modal__close">
    <a>
      <i class="material-icons" (click)="onClose()">close</i>
    </a>
  </div>

  <form [formGroup]="addMasterActivityForm" (submit)="onSubmitAddMasterActivity(addMasterActivityForm)">
    <div class="modal__body">
      <div class="row">
        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput [(ngModel)]='selectedActivity' placeholder="Master Activity"
                   formControlName="addmasteractivity" required>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addMasterActivityForm.get('addmasteractivity'))"
                            [errMsg]="validationMsg.MASTER_ACTIVITY_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12  MT-10">
          <mat-form-field>
            <mat-select placeholder="Team" formControlName="addmasterteam" [multiple]="true" [(ngModel)]='selectedTeam'>
              <mat-option *ngFor="let data of teamData; let i = index;" [value]="data.id">{{data.name}}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>
        <div class="col-md-12  MT-10">
          <mat-checkbox [checked]="isChecked ? true : false" formControlName="addworksheetschedule"> Add in worksheet
            schedule
          </mat-checkbox>
        </div>
      </div>
    </div>

    <div class="modal__footer MT-20">
      <div class="text-right row">
        <div class="col-md-12 PR-25">
          <button class="btn-primary" (click)="updateData()" *ngIf="buttonFlag"
                  [disabled]="addMasterActivityForm.invalid">Update
          </button>
          <button class="btn-primary" (click)="saveData()" *ngIf="!buttonFlag"
                  [disabled]="addMasterActivityForm.invalid">Save
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
<!--  End Change Master Activity dialog  -->

<!--  Start Training List Dialog  -->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">Add Training List</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose()">close</mat-icon>
    </a>
  </div>

  <form [formGroup]="addTrainingForm" (submit)="onSubmitAddTraininForm(addTrainingForm)">
    <div class="modal__body">
      <div class="row">
        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput placeholder="Training Name" formControlName="trainingName" required/>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addTrainingForm.get('trainingName'))"
                            [errMsg]="validationMsg.TRAINING_NAME_REQUIRED"></app-validation>
            <app-validation *ngIf="isValidField(addTrainingForm.get('trainingName'))"
                            [errMsg]="validationMsg.TRAINING_NAME_VALID"></app-validation>
          </div>
        </div>
      </div>
    </div>

    <div class="modal__footer">
      <div class="row">
        <div class="col-md-6 PL-25" *ngIf="!data['trainingData']">
          <button type="button" class="btn-orange btn-bordered"
                  (click)="onSubmitAddTraininForm(addTrainingForm , 'saveAddNew')">Save & Add New
          </button>
        </div>

        <div class="col-md-6 text-right PR-25" *ngIf="!data['trainingData']">
          <button type="submit" class="btn-primary">Save</button>
        </div>

        <div class="col-md-6 text-right PR-25" *ngIf="data['trainingData']">
          <button type="button" class="btn-primary" (click)="onSubmitUpdateTraininForm(addTrainingForm)">Update</button>
        </div>

      </div>
    </div>
  </form>
</div>
<!--  End Training List Dialog  -->

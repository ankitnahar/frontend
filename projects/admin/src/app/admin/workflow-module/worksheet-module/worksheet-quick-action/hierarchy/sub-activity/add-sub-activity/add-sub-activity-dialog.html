<!--  Start Add Sub Activity dialog  -->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">{{(data && data.subActivity) ? 'Update' : 'Add'}} Sub Activity</div>
  </div>

  <div class="modal__close">
    <a><i class="material-icons" (click)="onClose()">close</i></a>
  </div>

  <form [formGroup]="addSubActivity" (submit)="onSubmitAddSubActivity(addSubActivity)">
    <div class="modal__body">
      <div class="row">
        <div class="col-md-12 MT-10 custom-ng-select-dropdown">
          <mat-form-field>
            <mat-select placeholder="Master Activity" formControlName="master_id" required>
              <mat-option *ngFor="let data of masterActivityData; let i = index;" [value]="+data.id"> {{data.name}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <!--<ng-select [items]="masterActivityData"-->
          <!--[closeOnSelect]="true"-->
          <!--bindLabel="name"-->
          <!--placeholder="Master Activity"-->
          <!--bindValue="id"-->
          <!--[virtualScroll]="true"-->
          <!--[searchable]="true"-->
          <!--[hideSelected]="true"-->
          <!--formControlName="master_id">-->
          <!--</ng-select>-->
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addSubActivity.get('master_id'))"
                            [errMsg]="validationMsg.MASTER_ACTIVITY_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12  MT-10 custom-ng-select-dropdown">
          <ng-select
            [items]="taskData"
            bindLabel="name"
            bindValue="id"
            labelForId="state"
            [multiple]="false"
            placeholder="Select Task"
            clearAllText="Clear"
            [(ngModel)]="selectedTask"
            formControlName="task_id">
          </ng-select>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addSubActivity.get('task_id'))"
                            [errMsg]="validationMsg.TASK_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12  MT-10 MB-25">
          <mat-form-field>
            <textarea matInput placeholder="Sub Activity" [(ngModel)]="subactivityDefaultData"
                      formControlName="subactivity_name" required></textarea>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addSubActivity.get('subactivity_name'))"
                            [errMsg]="validationMsg.SUB_ACTIVITY_REQUIRED"></app-validation>
            <app-validation *ngIf="isValidField(addSubActivity.get('subactivity_name'))"
                            [errMsg]="validationMsg.SUB_ACTIVITY_VALID"></app-validation>
          </div>
        </div>
      </div>
    </div>

    <div class="modal__footer">
      <div class="text-right row">
        <div class="col-md-12 PR-25">
          <button class="btn-primary" (click)="updateData()" *ngIf="buttonFlag" [disabled]="addSubActivity.invalid">
            Update
          </button>
          <button class="btn-primary" (click)="saveData()" *ngIf="!buttonFlag" [disabled]="addSubActivity.invalid">
            Save
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
<!--  End Sub Activity dialog  -->

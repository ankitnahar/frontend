<!--Start Add calculatorForm form Dialog-->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">Add Sub Activity Calculator</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose()">close</mat-icon>
    </a>
  </div>
  <form [formGroup]="addcalculatorForm" (submit)="onSubmitAddCalc(addcalculatorForm)">
    <div class="modal__body">
      <div class="row">
        <div class="col-md-12">
          <mat-form-field>
            <input matInput placeholder="Sub Activity Calculator Name" formControlName="name" required>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addcalculatorForm.get('name'))"
                            [errMsg]="validationMsg.SERVICE_REQUIRED"></app-validation>
            <app-validation *ngIf="isValidField(addcalculatorForm.get('name'))"
                            [errMsg]="validationMsg.SERVICE_VALID"></app-validation>
          </div>
        </div>
      </div>
    </div>

    <div class="modal__footer">
      <div class="text-right row">
        <div class="col-md-12 PR-25">
          <button type="button" class="btn-default MR-10">Cancel</button>
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </div>
    </div>
  </form>
</div>

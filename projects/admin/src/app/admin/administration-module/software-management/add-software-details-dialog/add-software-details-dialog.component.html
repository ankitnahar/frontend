<!--  Start Add Software Details dialog  -->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">{{softwareManage.id > 0 ? 'Update' : 'Add'}} Software Detail</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose()">close</mat-icon>
    </a>
  </div>

  <form [formGroup]="addSoftwareDetailForm" (submit)="onSumbitSoftware(addSoftwareDetailForm)">
    <div class="modal__body">
      <div class="row">
        <div class="col-md-12">
          <mat-form-field>
            <mat-select placeholder="Software Name" formControlName="software_name" required>
              <mat-option *ngFor="let software of softwareNameList" [value]="software">
                {{software}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addSoftwareDetailForm.get('software_name'))"
                            [errMsg]="validationMsg.SOFTWARE_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12">
          <mat-form-field>
            <mat-select placeholder="Frequency" formControlName="frequency_id" required>
              <mat-option *ngFor="let frequency of frequencyList" [value]="frequency?.id">
                {{frequency?.frequency_name}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addSoftwareDetailForm.get('frequency_id'))"
                            [errMsg]="validationMsg.FREQUENCY_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput formControlName="transaction" placeholder="Transaction" required/>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addSoftwareDetailForm.get('transaction'))"
                            [errMsg]="validationMsg.TRANSACTION_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput formControlName="budgeted_unit" placeholder="Budgeted Unit" required>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addSoftwareDetailForm.get('budgeted_unit'))"
                            [errMsg]="validationMsg.UNIT_REQUIRED"></app-validation>
          </div>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <div class="text-right row">
        <div class="col-md-12 PR-25">
          <button class="btn-primary">Save</button>
        </div>
      </div>
    </div>
  </form>
</div>
<!--  End Software Detail dialog  -->

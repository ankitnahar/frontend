<!--  Start Change InOut Time dialog  -->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">{{this.data ? 'Update' : 'Add'}} Field Group</div>
  </div>

  <div class="modal__close">
    <a><i class="material-icons" (click)="onClose(addDynamicFieldGroupForm.value)">close</i></a>
  </div>

  <form [formGroup]="addDynamicFieldGroupForm" (submit)="onSubmitAddDynamicFieldGroupForm(addDynamicFieldGroupForm)">
    <div class="modal__body">
      <div class="row">
        <div class="col-md-12">
          <mat-form-field>
            <input matInput placeholder="Entity Group" formControlName="addentitygroup" required/>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addDynamicFieldGroupForm.get('addentitygroup'))"
                            [errMsg]="validationMsg.ENTITY_GROUP_REQUIRED"></app-validation>
            <app-validation *ngIf="isValidField(addDynamicFieldGroupForm.get('addentitygroup'))"
                            [errMsg]="validationMsg.ENTITY_GROUP_VALID"></app-validation>
          </div>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <div class="text-right row">
        <div class="col-md-6 PR-25">
          <button type="submit" (click)="saveAddNew(true)" class="btn-orange btn-bordered">Save & Add New</button>
        </div>
        <div class="col-md-6 PR-25">
          <button type="submit" (click)="saveAddNew(false)" class="btn-primary">Save</button>
        </div>
      </div>
    </div>
  </form>
</div>
<!--  End Change InOut Time dialog  -->

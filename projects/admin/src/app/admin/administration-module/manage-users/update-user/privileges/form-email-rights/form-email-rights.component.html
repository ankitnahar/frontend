<div>
  <!-- Start Table -->
  <div class="table-container">
    <div class="table-block">
      <table>
        <thead>
        <tr>
          <th width="5%">Sr. No.</th>
          <th width="55%">
            Email
          </th>
          <th width="40%">
            <mat-checkbox></mat-checkbox>
            Rights
          </th>
        </tr>
        </thead>
      </table>

      <div class="table-body">
        <table>
          <tbody>
          <tr *ngFor="let privilege of emailPrivilegesList; let i = index">
            <td width="5%">{{privilege?.srNo}}</td>
            <td width="55%">{{privilege?.email}}</td>
            <td width="40%">
              <mat-checkbox></mat-checkbox>
            </td>
          </tr>
          </tbody>
        </table>
        <div class="col-md-12 save-history-btns">
          <button type="button" class="btn-default MR-10">Cancel</button>
          <button type="submit" class="btn-primary">Update</button>
        </div>
      </div>
    </div>
  </div><!-- End Table -->
</div>

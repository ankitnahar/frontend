<!--  Invoice log Dialog  -->
<div class="modal large-modal">
  <div class="modal__header">
    <div class="modal__header__logo">User List</div>
  </div>

  <div class="modal__close">
    <a><i class="material-icons" (click)="onClose()">close</i></a>
  </div>

  <div class="modal__body">
    <!-- Start Request Table -->
    <div class="table-container dialog-table-container">
      <div class="table-block">
        <table class="PT-0">
          <thead>
          <tr>
            <th width="10%">Sr. No</th>
            <th width="65%">Username</th>
            <th width="25%">Designation</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let userData of viewUserList; let i = index">
            <td width="10%">{{i + 1}}</td>
            <td width="65%">{{userData['userfullname']}}</td>
            <td width="25%">{{userData['designation_name']}}</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- End Request Table -->
  </div>
</div>

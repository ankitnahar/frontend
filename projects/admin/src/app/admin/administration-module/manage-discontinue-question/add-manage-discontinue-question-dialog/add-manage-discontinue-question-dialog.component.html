<!--Start add Discontinue questionform Dialog-->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">{{this.questionDetail?.id > 0 ? 'Update' : 'Add'}} Discontinue Question</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose()">close</mat-icon>
    </a>
  </div>
  <form [formGroup]="addDiscontinueQuestionForm" (submit)="onSumbitDiscontinueQuestion(addDiscontinueQuestionForm)">
    <div class="modal__body">
      <div class="row MT-10">
        <div class="col-md-12">
          <mat-form-field>
            <mat-select formControlName="who_fillup" placeholder="Who Fillup?" required>
              <mat-option *ngFor="let option of whoFillUpList.slice(1)" [value]="option?.key">
                {{option?.label}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addDiscontinueQuestionForm.get('who_fillup'))"
                            [errMsg]="validationMsg.WHO_FILLUP_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <ng-select class="custom" [items]="questionListData"
                     [closeOnSelect]="true"
                     bindLabel="name"
                     placeholder="Parent question"
                     bindValue="id"
                     [virtualScroll]="true"
                     [searchable]="true"
                     [hideSelected]="true"
                     formControlName="parent_id">
          </ng-select>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <textarea matInput placeholder="Question" formControlName="name" required></textarea>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addDiscontinueQuestionForm.get('name'))"
                            [errMsg]="validationMsg.QUESTION_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <mat-select formControlName="type" placeholder="Question Type" required>
              <mat-option *ngFor="let option of discontinueQuestionTypedropdown.slice(1)" [value]="option?.key">
                {{option?.label}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addDiscontinueQuestionForm.get('type'))"
                            [errMsg]="validationMsg.QUESTION_TYPE_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <mat-select formControlName="is_active" placeholder="Status" required>
              <mat-option *ngFor="let option of activeInactivedropdown.slice(1)" [value]="option?.key">
                {{option?.label}}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addDiscontinueQuestionForm.get('is_active'))"
                            [errMsg]="validationMsg.STATUS_REQUIRED"></app-validation>
          </div>
        </div>

      </div>
    </div>

    <div class="modal__footer">
      <div class="text-right row">
        <div class="col-md-12 PR-25">
          <button type="submit" [disabled]="addDiscontinueQuestionForm.invalid" class="btn-primary">Submit</button>
        </div>
      </div>
    </div>
  </form>
</div>

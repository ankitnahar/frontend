<!--Start Reason Management form Dialog-->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">EDIT CC</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose()">close</mat-icon>
    </a>
  </div>
  <form [formGroup]="editCCForm" (submit)="onSubmitEmail(editCCForm)">
    <div class="modal__body">
      <div class="row MB-20">
        <div class="col-md-12">
          <mat-form-field>
            <textarea matInput placeholder="CC" formControlName="cc" rows="4"></textarea>
            <!--<input matInput placeholder="CC" formControlName="cc" required/>-->
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isValidField(editCCForm.get('cc'))"
                            [errMsg]="validationMsg.EMAIL_ADDRESS_VALID"></app-validation>
          </div>
        </div>
      </div>
    </div>

    <div class="modal__footer">
      <div class="text-right row">
        <div class="col-md-12 PR-25">
          <button type="submit" class="btn-primary">Save</button>
        </div>
      </div>
    </div>
  </form>
</div>

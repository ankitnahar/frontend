<!--  Start Favorite menu dialog  -->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">YASHKT</div>
  </div>

  <div class="modal__close">
    <a><i class="material-icons" (click)="onClose()">close</i></a>
  </div>

  <div class="modal__body">
    <!-- Start Request Table -->
    <div class="table-container dialog-table-container">
      <div class="table-block">
        <table class="PT-0">
          <thead>
          <tr>
            <th width="10%">Sr. No</th>
            <th width="20%">Type</th>
            <th width="10%">Rate</th>
            <th width="20%">Status</th>
            <th width="40%">Modified</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let row of [0,1,2,3]; let i=index">
            <td>{{i+1}}</td>
            <td>Basic</td>
            <td>35</td>
            <td>Active</td>
            <td>Shobhana Desai on 01/01/2014</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- End Request Table -->
  </div>
</div>
<!--  End Favorite menu dialog  -->

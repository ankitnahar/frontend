<!--  Start Sub Client List dialog  -->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">ADD TAX CHARGE</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose()">close</mat-icon>
    </a>
  </div>

  <form [formGroup]="addtaxationbasicchargeForm"
        (submit)="onSubmitAddTaxationbasicChargeForm(addtaxationbasicchargeForm)">
    <div class="modal__body">
      <div class="row">
        <div class="col-md-12">
          <mat-form-field>
            <mat-select placeholder="Year" formControlName="year" required>
              <mat-option *ngFor="let year of yearList" [value]="year.slice(5)">{{year.slice(5)}}</mat-option>
            </mat-select>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addtaxationbasicchargeForm.get('year'))"
                            [errMsg]="validationMsg.YEAR_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput placeholder="Amount" formControlName="amount"/>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addtaxationbasicchargeForm.get('amount'))"
                            [errMsg]="validationMsg.AMOUNT_REQUIRED"></app-validation>
          </div>
          <div class="validation-msg">
            <app-validation *ngIf="isValidField(addtaxationbasicchargeForm.get('amount'))"
                            [errMsg]="validationMsg.AMOUNT_VALID"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <mat-select placeholder="Option" formControlName="option">
              <mat-option *ngFor="let taxList of taxConditionList" [value]="taxList?.key">{{taxList?.label}}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addtaxationbasicchargeForm.get('option'))"
                            [errMsg]="validationMsg.OPTION_REQUIRED"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <input matInput placeholder="Turnover" formControlName="turnover"/>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isValidField(addtaxationbasicchargeForm.get('turnover'))"
                            [errMsg]="validationMsg.TURNOVER_VALID"></app-validation>
          </div>
        </div>

        <div class="col-md-12 MT-10">
          <mat-form-field>
            <textarea matInput placeholder="Notes" formControlName="notes"></textarea>
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <div class="row">
        <div class="col-md-12 PR-25 text-right">
          <button class="btn-primary" [disabled]="addtaxationbasicchargeForm.invalid">Save</button>
        </div>
      </div>
    </div>
  </form>
</div>
<!--  End Change Sub client list dialog  -->

<!--  Invoice log Dialog  -->
<div class="modal">
  <div class="modal__header">
    <div class="modal__header__logo">INVOICE LOG | {{invoiceData.billing_name}}</div>
  </div>

  <div class="modal__close">
    <a><i class="material-icons" (click)="onClose()">close</i></a>
  </div>

  <div class="modal__body">
    <!-- Start Request Table -->
    <div class="table-container dialog-table-container">
      <div class="table-block">
        <table class="PT-0">
          <thead>
          <tr>
            <th>Sr.No</th>
            <th>Status</th>
            <th>Sent By</th>
            <th>Sent On</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let data of invoiceLog; let i=index">
            <td>{{i+1}}</td>
            <td>{{data?.status_id?.name}}</td>
            <td>{{data?.modified_by?.modified_by}}</td>
            <td>{{data?.modified_on | date : 'dd-MM-yyyy HH:mm:ss' | checkEmpty}}</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- End Request Table -->
  </div>
</div>

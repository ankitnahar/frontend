<!-- Start add more bank modal -->
<div class="modal large-modal bank-dialog">
  <div class="modal__header">
    <div class="modal__header__logo">Add More Account Type</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose()">close</mat-icon>
    </a>
  </div>

  <div class="modal__body">
    <form [formGroup]="addAccountForm" #addAccountTypeForm="ngForm"
          (submit)="onAddAccountType(addAccountForm.value, addAccountForm.valid, null)" *ngIf="tabDataType['add_edit']">
      <div class="row">
        <div class="col-md-6 PL-0">
          <mat-form-field>
            <input formControlName="type_name" matInput type="text" autocomplete="off" placeholder="Type of account"
                   required/>
          </mat-form-field>
          <div class="validation-msg">
            <app-validation *ngIf="isRequiredField(addAccountForm.get('type_name'))"
                            [errMsg]="validationMsg.ACCOUNT_TYPE_REQUIRED"></app-validation>
          </div>
        </div>
        <div class="col-md-4 MT-5">
          <button [disabled]="addAccountForm.invalid" class="btn-primary" type="submit">Save</button>
        </div>
      </div>
    </form>
    <div class="table-container dialog-table-container">
      <div class="table-block">
        <div class="row">
          <!--<div class="col-md-4 PL-0">
            <div class="position-relative search-bank-information">
              <i class="material-icons">search</i>
              <input placeholder="Search" type="text" />
            </div>
          </div>-->
          <div class="col-md-12 PR-0">
            <mat-paginator [length]="totalRecords"
                           [pageSize]="pageSize"
                           [pageIndex]="pageIndex"
                           [pageSizeOptions]="pageArray"
                           (page)="onPageChange($event)"
            >
            </mat-paginator>
          </div>
        </div>
        <table>
          <thead>
          <tr>
            <th width="10%">Sr. no.</th>
            <th width="35%">Type of account</th>
            <th width="20%">Last Modified on</th>
            <th width="20%">Last Modified by</th>
            <th width="20%">Action</th>
          </tr>
          </thead>

          <tbody>
          <tr *ngFor="let accountTypeData of accountType; let i = index">
            <td>{{i+1}}</td>
            <td>
              <a *ngIf="!isBankUpdate" (click)="isBankUpdate = true">{{accountTypeData?.type_name}}</a>
              <input *ngIf="isBankUpdate" type="text" value={{accountTypeData?.type_name}}
                     (blur)="onAccountTypeNameUpdate($event.target.value,accountTypeData);isBankUpdate = false"/>
            </td>
            <td>{{accountTypeData?.modified_on | date : 'dd-MM-yyyy HH:mm:ss'}}</td>
            <td>{{accountTypeData?.modified_by?.modified_by}}</td>
            <td>
              <mat-slide-toggle *ngIf="tabDataType['add_edit']" [checked]="(accountTypeData?.is_active) ? true : false"
                                (change)="activeInactiveAccountType($event.checked,accountTypeData)"></mat-slide-toggle>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<div class="modal-layer" (click)="onClose()"></div>
<!-- End add more bank  modal -->

<!--  Start create backlog folder dialog  -->
<div class="modal">
  <div class="modal__header">
    <div class="modal__header__logo">Create Backlog Folder</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose(false)">close</mat-icon>
    </a>
  </div>

  <form [formGroup]="createbacklogfolderForm" (submit)="onSubmit(createbacklogfolderForm)">
    <div class="modal__body">
      <div class="row">
        <div class="col-md-12" *ngIf="googleDriveFolder && googleDriveFolder.subclient_id > 0">
          <mat-form-field>
            <mat-select
              placeholder="{{ 'Do you want to create folder in Subclient : ' + breadCrumFolder[1].folder?.directory_name + '?'}}"
              formControlName="is_subclient">
              <mat-option *ngFor="let YesNoData of YesNo.slice(1)" [value]="YesNoData?.key">
                {{ YesNoData?.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <div class="validation-msg">
          </div>
        </div>
        <div class="col-md-12">
          <mat-form-field>
            <mat-select placeholder="Year" formControlName="year" required>
              <mat-option *ngFor="let year of yearList" [value]="year['key']">
                {{year['key']}}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <div class="text-right row">
        <div class="col-md-12 PR-25">
          <button class="btn-primary" [disabled]="createbacklogfolderForm.invalid">Create</button>
        </div>
      </div>
    </div>
  </form>
</div>
<!--  End reate Folderdialog  -->

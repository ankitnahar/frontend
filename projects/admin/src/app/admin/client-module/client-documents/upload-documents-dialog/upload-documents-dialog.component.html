<!--  Start Upload documents  dialog  -->
<div class="modal">
  <div class="modal__header">
    <div class="modal__header__logo">Upload Documents</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose(false)">close</mat-icon>
    </a>
  </div>
  <div class="modal__body">
    <div class="row">
      <div class="col-md-12 PLR-0">

        <div class="client-upload-docuemnts-dialog MT-5 col-md-12 PLR-0">
          <div class="container_upload" appDnd (fileDropped)="onFileDropped($event)">
            <input type="file" #fileDropRef id="fileDropRef" multiple
                   (change)="fileBrowseHandler($event)"/>
            <mat-icon>cloud_upload</mat-icon>
            <h3>Drag and drop file here</h3>
            <h3>or</h3>
            <br/>
            <br/>
            <label for="fileDropRef">Browse for file</label>
          </div>
          <div class="files-list">
            <div class="single-file" *ngFor="let file of files; let i = index">
              <div class="file-icon" style="width: 50px">
                <mat-icon>picture_as_pdf</mat-icon>
              </div>
              <div class="info">
                <h4 class="name">
                  {{ file?.name }}
                </h4>
                <p class="size">
                  {{ formatBytes(file?.size) }}
                </p>
                <div *ngIf="file?.progress">
                  <div class="progress-cont">
                    <div class="progress" [style.width]="progress + '%'">
                    </div>
                  </div>
                </div>
              </div>

              <!--<div class="delete" (click)="deleteFile(i)">-->
              <!--<mat-icon>delete</mat-icon>-->
              <!--</div>-->
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!--  Invoice log Dialog  -->
<div class="modal large-modal">
  <div class="modal__header">
    <div class="modal__header__logo">Discontinue log</div>
  </div>

  <div class="modal__close">
    <a><i class="material-icons" (click)="onClose()">close</i></a>
  </div>

  <div class="modal__body">
    <!-- Start Request Table -->
    <div class="table-container dialog-table-container">
      <div class="table-block">
        <table class="PT-0">
          <thead>
          <tr>
            <th width="10%">Sr. No</th>
            <th width="45%">Status</th>
            <th width="25%">Updated by</th>
            <th width="25%">Updated on</th>
          </tr>
          </thead>
          <tbody>
          <tr *ngFor="let discontinuehistory of discontinueLog; let i=index">
            <td>{{i+1}}</td>
            <td>{{discontinuehistory?.values}}</td>
            <td>{{discontinuehistory?.modified_by?.userfullname}}</td>
            <td>{{discontinuehistory?.modified_on | date : 'dd-MM-yyyy'}}</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
    <!-- End Request Table -->
  </div>
</div>

<!--Start Send back to staff Dialog-->
<div>
  <div class="modal__header">
    <div class="modal__header__logo">SEND BACK TO STAFF</div>
  </div>

  <div class="modal__close">
    <a>
      <mat-icon class="material-icons" (click)="onClose()">close</mat-icon>
    </a>
  </div>
  <form [formGroup]="sendBacktoStaffForm">
    <div class="modal__body">
      <div class="row MT-20">
        <div class="col-md-12">
          <mat-form-field>
            <textarea matInput placeholder="Reason" formControlName="reason" row="2"></textarea>
          </mat-form-field>
        </div>
      </div>
      <div class="modal__footer">
        <div class="text-right row">
          <div class="col-md-12 PR-25">
            <button type="submit" class="btn-primary MR-5">Send Back to Staff</button>
            <button type="submit" class="btn-default">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>

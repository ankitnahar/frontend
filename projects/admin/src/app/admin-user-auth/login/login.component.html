<!-- Admin login html view -->
<div class="admin-login-container">
  <div class="panel-block">
    <div class="panel-block__container">
      <div class="panel-logo">
        <img src="assets/images/logo.png"/>
      </div>

      <div class="panel-body-container">
        <div class="panel-header">
          <h3>Welcome to HK Accountax!</h3>
        </div>
        <div class="panel-body">
          <!-- Start login form view -->
          <div class="login-screen" *ngIf="activeView == enumView.LOGIN_VIEW">
            <form [formGroup]="loginForm" (submit)="onSubmitLoginForm(loginForm)">
              <div class="row">
                <div class="col-md-12">
                  <mat-form-field>
                    <input matInput type="text" placeholder="Username" formControlName="user_login_name"/>
                  </mat-form-field>
                  <div class="validation-msg">
                    <app-validation *ngIf="isRequiredField(loginForm.get('user_login_name'))"
                                    [errMsg]="validationMsg.USERNAME"></app-validation>
                  </div>
                </div>

                <div class="col-md-12">
                  <mat-form-field>
                    <input matInput [type]="hide ? 'password' : 'text'" placeholder="Password"
                           formControlName="password"/>
                    <mat-icon matSuffix (click)="hide = !hide">{{hide ? 'visibility' : 'visibility_off'}}</mat-icon>
                  </mat-form-field>
                  <div class="validation-msg">
                    <app-validation *ngIf="isRequiredField(loginForm.get('password'))"
                                    [errMsg]="validationMsg.PASSWORD"></app-validation>
                  </div>
                </div>

                

                <div class="col-md-12 MT-20">
                  <button type="submit" class="btn-primary btn-block btn-login" [disabled]="!loginForm.valid">LOGIN
                  </button>
                </div>

                <div class="col-md-12 MT-30">
                  <div class="forgot-password-link">
                    <a (click)="onGoToForgotPassword()">Forgot Password?</a>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <!-- End login form view -->

          <!-- Start forgot email form view -->
          <div class="forgot-email-screen" *ngIf="activeView == enumView.FORGOT_EMAIL_VIEW">
            <form [formGroup]="forgotEmailForm"
                  (submit)="onSubmitForgotEmailForm(forgotEmailForm.value,forgotEmailForm.valid)">
              <div class="row">
                <div class="col-md-12">
                  <mat-form-field>
                    <input matInput type="text" placeholder="Email" formControlName="email" required/>
                  </mat-form-field>
                  <div class="validation-msg">
                    <app-validation *ngIf="isRequiredField(forgotEmailForm.get('email'))"
                                    .mat-icon { [errMsg]="validationMsg.EMAIL_ADDRESS"></app-validation>
                    <app-validation *ngIf="isValidField(forgotEmailForm.get('email'))"
                                    [errMsg]="validationMsg.EMAIL_ADDRESS_VALID"></app-validation>
                  </div>
                </div>
                <div class="col-md-12 MT-20">
                  <button type="submit" class="btn-primary btn-block btn-login" [disabled]="forgotEmailForm.invalid">
                    SEND RESET LINK
                  </button>
                </div>

                <div class="col-md-12">
                  <div class="back-to-login-link">
                    <a (click)="onBackToForgotEmail()" class="cursor-pointer">Go Back to Login</a>
                  </div>
                </div>
              </div>
            </form>
          </div>
          <!-- End forgot email form view -->
        </div>
      </div>
    </div>

    <!-- Start Copy right section -->
    <div class="panel-block__copyright">
      <p>Copyright@ {{currentYear}}. All Rights reserved to HK Accountax</p>
    </div>
    <!-- End Copy right section -->
  </div>
</div>

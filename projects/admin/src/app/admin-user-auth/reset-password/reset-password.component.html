<!-- Admin reset password html view -->
<div class="admin-login-container">
  <div class="panel-block">
    <div class="panel-block__container">
      <div class="panel-logo">
        <img src="assets/images/logo.png"/>
      </div>

      <div class="panel-body-container">
        <div class="panel-header">
          <h3>Welcome to befree!</h3>
        </div>

        <div class="panel-body">
          <div class="reset-password-screen">
            <!-- Start form view -->
            <form [formGroup]="resetPasswordForm"
                  (submit)="onSubmitResetPasswordForm(resetPasswordForm)">
              <div class="col-md-12">
                <mat-form-field>
                  <input matInput [type]="hide ? 'password' : 'text'" placeholder="New Password"
                         formControlName="password" required/>
                  <mat-icon matSuffix>
                    <mat-icon (click)="hide = !hide">{{hide ? 'visibility' : 'visibility_off'}}</mat-icon>
                  </mat-icon>
                </mat-form-field>
                <div class="validation-msg">
                  <app-validation *ngIf="isRequiredField(resetPasswordForm.get('password'))"
                                  [errMsg]="validationMsg.NEW_PASSWORD"></app-validation>
                </div>
              </div>

              <div class="col-md-12 MT-20">
                <mat-form-field>
                  <input matInput [type]="hideConfirm ? 'password' : 'text'" placeholder="Confirm Password"
                         formControlName="confirm_password"
                         required/>
                  <mat-icon matSuffix>
                    <mat-icon (click)="hideConfirm = !hideConfirm">{{hideConfirm ? 'visibility' : 'visibility_off'}}
                    </mat-icon>
                  </mat-icon>
                </mat-form-field>
                <div class="validation-msg">
                  <app-validation *ngIf="isRequiredField(resetPasswordForm.get('confirm_password'))"
                                  [errMsg]="validationMsg.CONFIRM_PASSWORD"></app-validation>
                  <app-validation
                    *ngIf="resetPasswordForm.controls.confirm_password.errors?.MatchPassword && resetPasswordForm.controls.confirm_password.dirty;"
                    [errMsg]="validationMsg.CONFIRM_PASSWORD_DOES_NOT_MATCH"></app-validation>

                  <!--<app-validation *ngIf="hasError(MatchPassword,resetPasswordForm,confirmPassword)"-->
                  <!--[errMsg]="validationMsg.CONFIRM_PASSWORD_DOES_NOT_MATCH"></app-validation>-->
                </div>
              </div>

              <div class="col-md-12 MT-30">
                <button type="submit" class="btn-primary btn-block btn-login" [disabled]="resetPasswordForm.invalid">
                  RESET PASSWORD
                </button>
              </div>
            </form>
            <!-- End form view -->
          </div>
        </div>
      </div>
    </div>
    <!-- Start Copy right section -->
    <div class="panel-block__copyright">
      <p>Copyright@ {{currentDate | date:'yyyy'}}. All Rights reserved to befree</p>
    </div>
    <!-- End Copy right section -->
  </div>
</div>

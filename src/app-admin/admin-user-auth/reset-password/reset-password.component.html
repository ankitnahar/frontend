<!-- Admin reset password html view -->
<div class="admin-login-container">
  <div class="panel-block">
    <div class="panel-block__container">
      <div class="panel-logo">
        <img src="assets/images/logo.png"/>
      </div>

      <div class="panel-body-container">
        <div class="panel-header">
          <h3>Welcome to BeFree!</h3>
        </div>

        <div class="panel-body">
          <div class="reset-password-screen">
            <!-- Start form view -->
            <form [formGroup]="resetPasswordForm"
                  (submit)="onSubmitResetPasswordForm(resetPasswordForm.value,resetPasswordForm.valid)">
              <div class="col-md-12">
                <mat-form-field>
                  <input matInput type="password" placeholder="New Password" formControlName="newPassword" required/>
                </mat-form-field>
                <div class="validation-msg">
                  <app-validation *ngIf="isRequiredField(resetPasswordForm.get('newPassword'))"
                                  [errMsg]="validationMsg.NEW_PASSWORD"></app-validation>
                </div>
              </div>

              <div class="col-md-12 MT-20">
                <mat-form-field>
                  <input matInput type="password" placeholder="Confirm Password" formControlName="confirmPassword"
                         required/>
                </mat-form-field>
                <div class="validation-msg">
                  <app-validation *ngIf="isRequiredField(resetPasswordForm.get('confirmPassword'))"
                                  [errMsg]="validationMsg.CONFIRM_PASSWORD"></app-validation>
                  <app-validation
                    *ngIf="resetPasswordForm.controls.confirmPassword.errors?.MatchPassword && resetPasswordForm.controls.confirmPassword.dirty;"
                    [errMsg]="validationMsg.CONFIRM_PASSWORD_DOES_NOT_MATCH"></app-validation>

                  <!--<app-validation *ngIf="hasError(MatchPassword,resetPasswordForm,confirmPassword)"-->
                  <!--[errMsg]="validationMsg.CONFIRM_PASSWORD_DOES_NOT_MATCH"></app-validation>-->
                </div>
              </div>

              <div class="col-md-12 MT-30">
                <button type="submit" class="btn-primary btn-block btn-login" [disabled]="resetPasswordForm.invalid">
                  RESET PASSWORD
                </button>
              </div>
            </form>
            <!-- End form view -->
          </div>
        </div>
      </div>
    </div>
    <!-- Start Copy right section -->
    <div class="panel-block__copyright">
      <p>Copyright@ 2018. All Rights reserved to BeFree</p>
    </div>
    <!-- End Copy right section -->
  </div>
</div>

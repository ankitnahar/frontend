<!-- Admin (Administration) user change html view -->
<div class="admin-user-change-password-container">
  <!-- Start form view -->
  <form [formGroup]="changePasword" (submit)="onSubmitChangePassword(changePasword.value,changePasword.valid)">
    <div class="row">
      <div class="col-md-4">
        <div class="row">
          <div class="col-md-12 PLR-0">
            <mat-form-field>
              <input matInput type="password" placeholder="New Password" formControlName="new_password"/>
            </mat-form-field>
            <div class="validation-msg">
              <app-validation *ngIf="isRequiredField(changePasword.get('new_password'))"
                              [errMsg]="validationMsg.NEW_PASSWORD"></app-validation>
            </div>
          </div>

          <div class="col-md-12 PLR-0 MT-5">
            <mat-form-field>
              <input matInput type="password" placeholder="Confirm New Password" formControlName="confirm_new_password"/>
            </mat-form-field>

            <div class="validation-msg">
              <app-validation *ngIf="isRequiredField(changePasword.get('confirm_new_password'))"
                              [errMsg]="validationMsg.CONFIRM_PASSWORD"></app-validation>
              <app-validation *ngIf="changePasword.controls.confirm_new_password.errors?.ConfirmPassword && changePasword.controls.confirm_new_password.dirty;"
                              [errMsg]="validationMsg.CONFIRM_PASSWORD_DOES_NOT_MATCH"></app-validation>

              <!--<app-validation *ngIf="hasError(MatchPassword,resetPasswordForm,confirmPassword)"-->
              <!--[errMsg]="validationMsg.CONFIRM_PASSWORD_DOES_NOT_MATCH"></app-validation>-->
            </div>
          </div>

          <div class="col-md-12 save-history-btns">
            <button type="button" class="btn-cancel">Cancel</button>
            <button type="submit" class="btn-primary" [disabled]="!changePasword.valid">Save</button>
          </div>
        </div>
      </div>
    </div>
  </form>
  <!-- End form view -->
</div>
